function unb(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function tryOpen(pass){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(P.n)},key,unb(P.c));
  if(P.z){buf=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}
  var o=JSON.parse(new TextDecoder().decode(buf));
  window.__DATA=o.data;document.open();document.write(o.app);document.close()
}
var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
async function run(pass,silent){
  if(!window.crypto||!crypto.subtle){err.textContent='This browser cannot open the page. Try Chrome or Safari.';return}
  go.disabled=true;go.textContent='Unlocking...';err.textContent='';
  try{await tryOpen(pass);try{localStorage.setItem('tf4pass',pass)}catch(e){}}

}
f.addEventListener('submit',function(e){e.preventDefault();if(pw.value)run(pw.value,false)});
